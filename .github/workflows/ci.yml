name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ubuntu-py38:
    name: Ubuntu / Python 3.8
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify (0 failed / 0 skipped)
        run: python -m scripts.verify

  ubuntu:
    name: Ubuntu / mainline Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify (0 failed / 0 skipped)
        run: python -m scripts.verify

  macos:
    name: macOS / mainline Python
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify (0 failed / 0 skipped)
        run: python -m scripts.verify

  windows:
    name: Windows / mainline Python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify (0 failed / 0 skipped)
        run: python -m scripts.verify
